apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-kev 
  labels:
    app: firstkube-deployment
spec:
  selector:
    matchLabels:
      app: backend-kev 
  replicas: 1
  template:
    metadata:
      labels:
        app: backend-kev
    spec:
      containers:
      - name: backend-kev-main
        image: docker.io/keval1101/simple_backend:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-kev-service
spec:
  selector:
    app: backend-kev
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
