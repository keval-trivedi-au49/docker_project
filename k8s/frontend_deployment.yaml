apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-kev 
  labels:
    app: frontend-kev-deployment
spec:
  selector:
    matchLabels:
      app: frontend-kev
  replicas: 1
  template:
    metadata:
      labels:
        app: frontend-kev
    spec:
      containers:
      - name: frontend-kev-main
        image: docker.io/keval1101/simple_frontend:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-kev-service
spec:
  selector:
    app: frontend-kev
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000